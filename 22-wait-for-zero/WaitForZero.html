<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache">
<title>Command Loom</title>
<style>
body{margin:0;background:#070c16;color:#e9eef6;font:15px "Segoe UI",sans-serif}
main{display:flex;gap:22px;padding:18px;align-items:flex-start;flex-wrap:wrap}
#stage{flex:3 1 640px;min-width:0}#side{flex:1 1 300px;max-width:460px;display:flex;flex-direction:column;gap:9px}
canvas{display:block;background:#000;margin:auto}
h1{font-size:19px;margin:0}
button{background:#182436;color:#e8edf5;border:1px solid #2c3d55;border-radius:6px;padding:8px 11px;font:inherit;cursor:pointer;text-align:left}
button:hover{background:#22344c}button:disabled{opacity:.45}button.on{border-color:#ffbd38;color:#ffbd38}
#list{display:flex;flex-direction:column;gap:5px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
#message{min-height:2.4em;white-space:pre-wrap}.muted{color:#93a3b8;font-size:13px;line-height:1.5}input[type=range]{width:100%}
</style></head><body><main>
<div id="stage"><canvas id="screen"></canvas></div>
<div id="side">
<h1 id="title">Command Loom</h1>
<div id="list"></div>
<input id="position" type="range" min="0" step=".033333333" value="0"><div class="muted" id="clock"></div>
<div class="row"><button id="play">Play / pause</button><label><input id="sound" type="checkbox"> Sound</label><label><input id="ui" type="checkbox"> Shorts UI zones</label></div>
<div class="row"><button id="export">Export selected MP4</button><button id="all">Export all</button><button id="cancel">Cancel</button></div>
<div id="message"></div>
<div class="muted">Frame-by-frame export, 30 fps. Use an up-to-date Chrome or Edge. The MP4 is saved to your downloads folder; keep the tab and the server window open while it runs.</div>
</div></main>
<script src="vendor/three-r128.min.js"></script>
<script src="vendor/mp4-muxer-5.1.3.min.js"></script>
<script src="engine/sound.js?v=10192153"></script>
<script src="engine/export.js?v=10192153"></script>
<script src="engine/draw.js?v=10192153"></script>
<script src="engine/shrink.js?v=10192153"></script>
<script src="engine/video.js?v=10192153"></script>
<script src="engine/player.js?v=10192153"></script>
</body></html>
